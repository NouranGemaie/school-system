<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - نظام إدارة المدرسة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 h-screen flex items-center justify-center p-4">

  <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden border border-slate-700">
    <!-- Header banner -->
    <div class="bg-emerald-600 p-6 text-center text-white relative">
      <div class="w-20 h-20 bg-white text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg text-3xl">
        <i class="fa-solid fa-school"></i>
      </div>
      <h2 class="text-2xl font-bold">مرحبًا بك</h2>
      <p class="text-emerald-100 text-sm mt-1">تسجيل الدخول لنظام إدارة المدرسة</p>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">اسم المستخدم / البريد</label>
        <div class="relative">
          <span class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400">
            <i class="fa-solid fa-user"></i>
          </span>
          <input type="text" id="username" required placeholder="admin" class="w-full pr-10 pl-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">كلمة المرور</label>
        <div class="relative">
          <span class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input type="password" id="password" required placeholder="••••••••" class="w-full pr-10 pl-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>
      </div>

      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg shadow transition duration-200">
        دخول اللوحة <i class="fa-solid fa-arrow-left mr-2"></i>
      </button>
    </form>
  </div>

  <script>
   document.getElementById('loginForm').addEventListener('submit', (e) => {
  e.preventDefault();
  // التوجيه للصفحة الرئيسية اللي بتعرض الداشبورد
  window.location.href = '/'; 
});
  </script>
</body>
</html>
